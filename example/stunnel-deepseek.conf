; TLS sidecar 示例：本地明文 HTTP -> 远端 HTTPS。
;
; 启动：
;   stunnel4 example/stunnel-deepseek.conf
;
; 然后代理这样连：
;   ./proxy/build/http_proxy_test 8081 443 api.deepseek.com 127.0.0.1 18443
;
; 注意：
;   - accept 只绑定 127.0.0.1，不要暴露到公网
;   - verifyChain/checkHost 必须打开
;   - CAfile 路径按发行版调整（Debian/Ubuntu 是下面这个）

foreground = yes
client = yes
debug = info

[deepseek]
accept  = 127.0.0.1:18443
connect = api.deepseek.com:443

sni         = api.deepseek.com
verifyChain = yes
checkHost   = api.deepseek.com
CAfile      = /etc/ssl/certs/ca-certificates.crt
sslVersionMin = TLSv1.2

